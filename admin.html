<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reliance Finance - Admin Panel</title>

<style>

* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f6f9;
    margin: 0;
    padding: 20px;
}

h1 {
    color: #1d3557;
}

/* LOGIN */

#loginScreen {
    min-height: calc(100vh - 40px);
    display: flex;
    justify-content: center;
    align-items: center;
}

.login-box {
    width: 100%;
    max-width: 420px;
    background: white;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 3px 15px rgba(0,0,0,0.12);
}

.login-box h1 {
    text-align: center;
    margin-top: 0;
}

.login-box p {
    text-align: center;
    color: #666;
}

.login-box label {
    display: block;
    font-weight: bold;
    margin-top: 15px;
}

.login-box input {
    width: 100%;
    padding: 13px;
    margin-top: 6px;
    border: 1px solid #aaa;
    border-radius: 7px;
    font-size: 16px;
}

.login-btn {
    width: 100%;
    padding: 13px;
    margin-top: 20px;
    border: none;
    border-radius: 7px;
    background: #1d3557;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

#loginMessage {
    margin-top: 15px;
    text-align: center;
    font-weight: bold;
    color: #c62828;
}

/* ADMIN */

#adminPanel {
    display: none;
}

.admin-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 20px;
}

.admin-header h1 {
    margin: 0;
}

.logout-btn {
    padding: 10px 18px;
    background: #c62828;
    color: white;
    border: none;
    border-radius: 7px;
    cursor: pointer;
}

/* SEARCH */

#searchBox {
    width: 90%;
    max-width: 550px;
    padding: 14px;
    font-size: 16px;
    margin-bottom: 20px;
    border: 1px solid #aaa;
    border-radius: 8px;
}

/* CONTACT */

.contact-box,
.account-box {
    background: white;
    padding: 20px;
    margin-bottom: 25px;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.contact-box h2,
.account-box h2 {
    color: #1d3557;
    margin-top: 0;
}

.contact-note,
.account-note {
    background: #fff8e1;
    border: 1px solid #ffe082;
    padding: 10px;
    border-radius: 7px;
    margin-bottom: 15px;
    font-size: 14px;
}

.contact-box label,
.account-box label {
    display: block;
    font-weight: bold;
    margin-top: 12px;
}

.contact-box input,
.account-box input {
    width: 100%;
    padding: 12px;
    margin-top: 6px;
    border: 1px solid #aaa;
    border-radius: 7px;
    font-size: 15px;
}

.save-contact-btn,
.save-account-btn {
    margin-top: 18px;
    padding: 11px 20px;
    background: #1d3557;
    color: white;
    border: none;
    border-radius: 7px;
    cursor: pointer;
}

.contact-message,
.account-message {
    margin-top: 12px;
    font-weight: bold;
}

/* APPLICATION */

.application {
    background: white;
    padding: 20px;
    margin-bottom: 15px;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.application p {
    margin: 8px 0;
}

.customer-photo {
    width: 100px;
    height: 100px;
    object-fit: cover;
    border-radius: 10px;
    border: 2px solid #ddd;
    margin: 10px 0;
}

/* CHARGES */

.charges-box {
    background: #f8fbff;
    border: 1px solid #dce8f5;
    padding: 15px;
    margin-top: 15px;
    border-radius: 10px;
}

.charges-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.charges-title h3 {
    color: #1d3557;
    margin: 0;
}

.charges-toggle {
    padding: 9px 15px;
    background: #1d3557;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}

.charges-options {
    display: none;
    margin-top: 15px;
}

.charge-item {
    background: white;
    border: 1px solid #ddd;
    padding: 12px;
    margin-bottom: 10px;
    border-radius: 8px;
}

.charge-select {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: bold;
    cursor: pointer;
}

.charge-select input[type="checkbox"] {
    width: 18px;
    height: 18px;
}

.amount-box {
    display: none;
    margin-top: 10px;
}

.amount-box input {
    width: 95%;
    padding: 9px;
    border: 1px solid #aaa;
    border-radius: 6px;
    font-size: 15px;
}

.save-charges-btn {
    padding: 10px 18px;
    margin-top: 10px;
    background: #1d3557;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}

/* STATUS */

.status-select {
    padding: 8px;
    font-size: 15px;
    border-radius: 6px;
    margin-top: 5px;
}

.save-btn {
    padding: 8px 15px;
    margin-left: 8px;
    background: #1d3557;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}

.no-data {
    background: white;
    padding: 20px;
    border-radius: 10px;
}

/* MOBILE */

@media (max-width: 600px) {

    body {
        padding: 12px;
    }

    .admin-header {
        flex-direction: column;
        align-items: flex-start;
    }

    .charges-title {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
    }

    .save-btn {
        margin-left: 0;
        margin-top: 8px;
    }

}

</style>

</head>

<body>

<!-- LOGIN SCREEN -->

<div id="loginScreen">

    <div class="login-box">

        <h1>Admin Login</h1>

        <p>Reliance Finance Admin Panel</p>

        <form id="adminLoginForm">

            <label>User ID</label>

            <input
                type="text"
                id="adminUserId"
                placeholder="Enter User ID"
                autocomplete="username"
                required
            >

            <label>Password</label>

            <input
                type="password"
                id="adminPassword"
                placeholder="Enter Password"
                autocomplete="current-password"
                required
            >

            <button
                type="submit"
                class="login-btn"
            >
                Login
            </button>

        </form>

        <div id="loginMessage"></div>

    </div>

</div>


<!-- ADMIN PANEL -->

<div id="adminPanel">

    <div class="admin-header">

        <h1>Reliance Finance - Admin Panel</h1>

        <button
            type="button"
            class="logout-btn"
            id="logoutBtn"
        >
            Logout
        </button>

    </div>


    <!-- CONTACT DETAILS -->

    <div class="contact-box">

        <h2>Website Contact Details</h2>

        <div class="contact-note">
            यह learning/demo project है। यहां website के
            contact details बदल सकते हैं।
        </div>

        <label>WhatsApp Number</label>

        <input
            type="text"
            id="whatsappNumber"
            placeholder="Enter WhatsApp number"
        >

        <label>Helpline Number</label>

        <input
            type="text"
            id="helplineNumber"
            placeholder="Enter helpline number"
        >

        <label>Email Address</label>

        <input
            type="email"
            id="contactEmail"
            placeholder="Enter email address"
        >

        <button
            type="button"
            class="save-contact-btn"
            onclick="saveContactDetails()"
        >
            Save Contact Details
        </button>

        <div
            id="contactMessage"
            class="contact-message"
        ></div>

    </div>


    <!-- ACCOUNT DETAILS -->

    <div class="account-box">

        <h2>Demo Account Details</h2>

        <div class="account-note">
            यह learning/demo project है। Testing के लिए
            केवल dummy details का उपयोग करें।
        </div>

        <label>Account Holder Name</label>

        <input
            type="text"
            id="accountHolderName"
            placeholder="Enter demo account holder name"
        >

        <label>Bank Name</label>

        <input
            type="text"
            id="bankName"
            placeholder="Enter demo bank name"
        >

        <label>Account Number</label>

        <input
            type="text"
            id="accountNumber"
            placeholder="Enter demo account number"
        >

        <label>IFSC Code</label>

        <input
            type="text"
            id="ifscCode"
            placeholder="Enter demo IFSC code"
        >

        <label>UPI ID</label>

        <input
            type="text"
            id="upiId"
            placeholder="Enter demo UPI ID"
        >

        <button
            type="button"
            class="save-account-btn"
            onclick="saveAccountDetails()"
        >
            Save Account Details
        </button>

        <div
            id="accountMessage"
            class="account-message"
        ></div>

    </div>


    <!-- SEARCH -->

    <input
        type="text"
        id="searchBox"
        placeholder="Search by name or mobile..."
    >


    <!-- APPLICATIONS -->

    <div id="applications">
        Loading applications...
    </div>

</div>


<script>

let allApplications = [];


/* ================================
   ADMIN LOGIN
================================ */

document
    .getElementById("adminLoginForm")
    .addEventListener(
        "submit",
        async function(e) {

            e.preventDefault();

            const userId =
                document
                    .getElementById("adminUserId")
                    .value
                    .trim();

            const password =
                document
                    .getElementById("adminPassword")
                    .value;

            const message =
                document.getElementById(
                    "loginMessage"
                );

            message.innerText =
                "Logging in...";

            try {

                const response =
                    await fetch(
                        "/admin-login",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            credentials:
                                "same-origin",

                            body:
                                JSON.stringify({
                                    userId:
                                        userId,

                                    password:
                                        password
                                })
                        }
                    );

                const result =
                    await response.json();

                if (
                    response.ok &&
                    result.success
                ) {

                    document
                        .getElementById(
                            "loginScreen"
                        )
                        .style.display =
                            "none";

                    document
                        .getElementById(
                            "adminPanel"
                        )
                        .style.display =
                            "block";

                    message.innerText = "";

                    loadAccountDetails();
                    loadApplications();

                } else {

                    message.innerText =
                        result.message ||
                        "Wrong User ID or Password.";

                }

            } catch (error) {

                console.log(error);

                message.innerText =
                    "Server se connection nahi ho raha hai.";

            }

        }
    );


/* ================================
   CHECK ADMIN SESSION
================================ */

async function checkAdminSession() {

    try {

        const response =
            await fetch(
                "/admin-session",
                {
                    credentials:
                        "same-origin"
                }
            );

        const result =
            await response.json();

        if (
            response.ok &&
            result.success &&
            result.loggedIn
        ) {

            document
                .getElementById(
                    "loginScreen"
                )
                .style.display =
                    "none";

            document
                .getElementById(
                    "adminPanel"
                )
                .style.display =
                    "block";

            loadAccountDetails();
            loadApplications();

        } else {

            document
                .getElementById(
                    "loginScreen"
                )
                .style.display =
                    "flex";

            document
                .getElementById(
                    "adminPanel"
                )
                .style.display =
                    "none";

        }

    } catch (error) {

        console.log(error);

    }

}


/* ================================
   LOGOUT
================================ */

document
    .getElementById("logoutBtn")
    .addEventListener(
        "click",
        async function() {

            try {

                await fetch(
                    "/admin-logout",
                    {
                        method: "POST",
                        credentials:
                            "same-origin"
                    }
                );

            } catch (error) {

                console.log(error);

            }

            document
                .getElementById(
                    "adminPanel"
                )
                .style.display =
                    "none";

            document
                .getElementById(
                    "loginScreen"
                )
                .style.display =
                    "flex";

            document
                .getElementById(
                    "adminLoginForm"
                )
                .reset();

            document
                .getElementById(
                    "loginMessage"
                )
                .innerText = "";

        }
    );


/* ================================
   SAVE CONTACT DETAILS
================================ */

async function saveContactDetails() {

    const contactDetails = {

        whatsappNumber:
            document
                .getElementById(
                    "whatsappNumber"
                )
                .value
                .trim(),

        helplineNumber:
            document
                .getElementById(
                    "helplineNumber"
                )
                .value
                .trim(),

        contactEmail:
            document
                .getElementById(
                    "contactEmail"
                )
                .value
                .trim()

    };

    try {

        const response =
            await fetch(
                "/save-account-details",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    credentials:
                        "same-origin",

                    body:
                        JSON.stringify(
                            contactDetails
                        )
                }
            );

        const result =
            await response.json();

        if (result.success) {

            document
                .getElementById(
                    "contactMessage"
                )
                .innerText =
                    "Contact Details saved successfully!";

        } else {

            document
                .getElementById(
                    "contactMessage"
                )
                .innerText =
                    result.message ||
                    "Contact details save nahi hui.";

        }

    } catch (error) {

        console.log(error);

        document
            .getElementById(
                "contactMessage"
            )
            .innerText =
                "Server se connection nahi ho raha hai.";

    }

}


/* ================================
   SAVE ACCOUNT DETAILS
================================ */

async function saveAccountDetails() {

    const accountDetails = {

        accountHolderName:
            document
                .getElementById(
                    "accountHolderName"
                )
                .value
                .trim(),

        bankName:
            document
                .getElementById("bankName")
                .value
                .trim(),

        accountNumber:
            document
                .getElementById("accountNumber")
                .value
                .trim(),

        ifscCode:
            document
                .getElementById("ifscCode")
                .value
                .trim(),

        upiId:
            document
                .getElementById("upiId")
                .value
                .trim()

    };

    try {

        const response =
            await fetch(
                "/save-account-details",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    credentials:
                        "same-origin",

                    body:
                        JSON.stringify(
                            accountDetails
                        )
                }
            );

        const result =
            await response.json();

        if (result.success) {

            document
                .getElementById(
                    "accountMessage"
                )
                .innerText =
                    "Demo Account Details saved successfully!";

        } else {

            document
                .getElementById(
                    "accountMessage"
                )
                .innerText =
                    result.message ||
                    "Account details save nahi hui.";

        }

    } catch (error) {

        console.log(error);

        document
            .getElementById(
                "accountMessage"
            )
            .innerText =
                "Server se connection nahi ho raha hai.";

    }

}


/* ================================
   LOAD ACCOUNT DETAILS
================================ */

async function loadAccountDetails() {

    try {

        const response =
            await fetch(
                "/account-details"
            );

        const result =
            await response.json();

        if (
            result.success &&
            result.accountDetails
        ) {

            const account =
                result.accountDetails;

            document
                .getElementById(
                    "accountHolderName"
                )
                .value =
                    account.accountHolderName || "";

            document
                .getElementById("bankName")
                .value =
                    account.bankName || "";

            document
                .getElementById(
                    "accountNumber"
                )
                .value =
                    account.accountNumber || "";

            document
                .getElementById("ifscCode")
                .value =
                    account.ifscCode || "";

            document
                .getElementById("upiId")
                .value =
                    account.upiId || "";

            document
                .getElementById(
                    "whatsappNumber"
                )
                .value =
                    account.whatsappNumber || "";

            document
                .getElementById(
                    "helplineNumber"
                )
                .value =
                    account.helplineNumber || "";

            document
                .getElementById(
                    "contactEmail"
                )
                .value =
                    account.contactEmail || "";

        }

    } catch (error) {

        console.log(error);

    }

}


/* ================================
   LOAD APPLICATIONS
================================ */

async function loadApplications() {

    try {

        const response =
            await fetch(
                "/applications",
                {
                    credentials:
                        "same-origin"
                }
            );

        if (!response.ok) {

            if (response.status === 401) {

                document
                    .getElementById(
                        "adminPanel"
                    )
                    .style.display =
                        "none";

                document
                    .getElementById(
                        "loginScreen"
                    )
                    .style.display =
                        "flex";

                return;

            }

            throw new Error(
                "Applications load failed"
            );

        }

        allApplications =
            await response.json();

        displayApplications(
            allApplications
        );

    } catch (error) {

        console.log(error);

        document
            .getElementById(
                "applications"
            )
            .innerHTML =
                "Server se connection nahi ho raha hai.";

    }

}


/* ================================
   DISPLAY APPLICATIONS
================================ */

function displayApplications(
    applications
) {

    const container =
        document.getElementById(
            "applications"
        );

    if (
        applications.length === 0
    ) {

        container.innerHTML = `
            <div class="no-data">
                No applications found.
            </div>
        `;

        return;

    }

    container.innerHTML = "";

    applications.forEach(
        function(app, index) {

            const currentStatus =
                app.status || "Pending";

            let photoHTML = "";

            if (app.customerPhoto) {

                photoHTML = `
                    <p>
                        <b>Customer Photo:</b>
                    </p>

                    <img
                        src="${app.customerPhoto}"
                        class="customer-photo"
                    >
                `;

            }

            container.innerHTML += `

            <div class="application">

                <h2>
                    Application #${index + 1}
                </h2>

                ${photoHTML}

                <p>
                    <b>Name:</b>
                    ${app.name || ""}
                </p>

                <p>
                    <b>Mobile:</b>
                    ${app.mobile || ""}
                </p>

                <p>
                    <b>Email:</b>
                    ${app.email || ""}
                </p>

                <p>
                    <b>Date of Birth:</b>
                    ${app.dob || ""}
                </p>

                <p>
                    <b>Address:</b>
                    ${app.address || ""}
                </p>

                <p>
                    <b>Loan Type:</b>
                    ${app.loanType || ""}
                </p>

                <p>
                    <b>Loan Amount:</b>
                    ₹${app.loanAmount || ""}
                </p>

                <p>
                    <b>Occupation:</b>
                    ${app.occupation || ""}
                </p>

                <p>
                    <b>Monthly Income:</b>
                    ₹${app.income || ""}
                </p>

                <p>
                    <b>Employment:</b>
                    ${app.employment || ""}
                </p>

                <p>
                    <b>City:</b>
                    ${app.city || ""}
                </p>

                <p>
                    <b>State:</b>
                    ${app.state || ""}
                </p>

                <p>
                    <b>Status:</b>
                    ${currentStatus}
                </p>

                <select
                    class="status-select"
                    id="status-${index}"
                >

                    <option
                        value="Pending"
                        ${
                            currentStatus === "Pending"
                            ? "selected"
                            : ""
                        }
                    >
                        Pending
                    </option>

                    <option
                        value="Approved"
                        ${
                            currentStatus === "Approved"
                            ? "selected"
                            : ""
                        }
                    >
                        Approved
                    </option>

                    <option
                        value="Rejected"
                        ${
                            currentStatus === "Rejected"
                            ? "selected"
                            : ""
                        }
                    >
                        Rejected
                    </option>

                </select>

                <button
                    class="save-btn"
                    onclick="updateStatus(${index})"
                >
                    Save Status
                </button>

                <div class="charges-box">

                    <div class="charges-title">

                        <h3>
                            Demo Charges
                        </h3>

                        <button
                            type="button"
                            class="charges-toggle"
                            onclick="toggleCharges(${index})"
                        >
                            Select Charges
                        </button>

                    </div>

                    <div
                        class="charges-options"
                        id="charges-options-${index}"
                    >

                        ${chargeItem(
                            "processingFee",
                            "Processing Fee",
                            app.processingFee,
                            index
                        )}

                        ${chargeItem(
                            "tds",
                            "TDS",
                            app.tds,
                            index
                        )}

                        ${chargeItem(
                            "rbiCharge",
                            "RBI Charge",
                            app.rbiCharge,
                            index
                        )}

                        ${chargeItem(
                            "gst",
                            "GST",
                            app.gst,
                            index
                        )}

                        ${chargeItem(
                            "nocCharge",
                            "NOC Charge",
                            app.nocCharge,
                            index
                        )}

                        ${chargeItem(
                            "verificationCharge",
                            "Verification Charge",
                            app.verificationCharge,
                            index
                        )}

                        ${chargeItem(
                            "documentationCharge",
                            "Documentation Charge",
                            app.documentationCharge,
                            index
                        )}

                        <button
                            type="button"
                            class="save-charges-btn"
                            onclick="saveCharges(${index})"
                        >
                            Save Charges
                        </button>

                    </div>

                </div>

            </div>

            `;

        }
    );

}

<!-- PART 1 END -->
/* ================================
   CHARGE ITEM
================================ */

function chargeItem(
    name,
    title,
    value,
    index
) {

    const checked =
        value ? "checked" : "";

    const display =
        value ? "block" : "none";

    return `

        <div class="charge-item">

            <label class="charge-select">

                <input
                    type="checkbox"
                    id="select-${name}-${index}"
                    ${checked}
                    onchange="toggleAmount('${name}', ${index})"
                >

                ${title}

            </label>

            <div
                class="amount-box"
                id="amount-${name}-${index}"
                style="display:${display};"
            >

                <input
                    type="number"
                    id="${name}-${index}"
                    value="${value || ""}"
                    placeholder="Enter Amount"
                >

            </div>

        </div>

    `;

}


/* ================================
   TOGGLE CHARGES
================================ */

function toggleCharges(index) {

    const box =
        document.getElementById(
            "charges-options-" + index
        );

    if (!box) {
        return;
    }

    if (
        box.style.display === "block"
    ) {

        box.style.display = "none";

    } else {

        box.style.display = "block";

    }

}


/* ================================
   TOGGLE AMOUNT
================================ */

function toggleAmount(
    name,
    index
) {

    const checkbox =
        document.getElementById(
            "select-" +
            name +
            "-" +
            index
        );

    const box =
        document.getElementById(
            "amount-" +
            name +
            "-" +
            index
        );

    const input =
        document.getElementById(
            name +
            "-" +
            index
        );

    if (!checkbox || !box) {
        return;
    }

    if (checkbox.checked) {

        box.style.display =
            "block";

    } else {

        box.style.display =
            "none";

        if (input) {
            input.value = "";
        }

    }

}


/* ================================
   UPDATE STATUS
================================ */

async function updateStatus(index) {

    const app =
        allApplications[index];

    const statusElement =
        document.getElementById(
            "status-" + index
        );

    if (!statusElement) {
        return;
    }

    const status =
        statusElement.value;

    try {

        const response =
            await fetch(
                "/update-status",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    credentials:
                        "same-origin",

                    body:
                        JSON.stringify({

                            mobile:
                                app.mobile,

                            status:
                                status

                        })
                }
            );

        const result =
            await response.json();

        if (result.success) {

            alert(
                "Status updated successfully."
            );

            loadApplications();

        } else {

            alert(
                result.message ||
                "Status update failed."
            );

        }

    } catch (error) {

        console.log(error);

        alert(
            "Server se connection nahi ho raha hai."
        );

    }

}


/* ================================
   SAVE CHARGES
================================ */

async function saveCharges(index) {

    const app =
        allApplications[index];

    const charges = {

        processingFee:
            getChargeValue(
                "processingFee",
                index
            ),

        tds:
            getChargeValue(
                "tds",
                index
            ),

        rbiCharge:
            getChargeValue(
                "rbiCharge",
                index
            ),

        gst:
            getChargeValue(
                "gst",
                index
            ),

        nocCharge:
            getChargeValue(
                "nocCharge",
                index
            ),

        verificationCharge:
            getChargeValue(
                "verificationCharge",
                index
            ),

        documentationCharge:
            getChargeValue(
                "documentationCharge",
                index
            )

    };

    try {

        const response =
            await fetch(
                "/update-charges",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    credentials:
                        "same-origin",

                    body:
                        JSON.stringify({

                            mobile:
                                app.mobile,

                            ...charges

                        })
                }
            );

        const result =
            await response.json();

        if (result.success) {

            alert(
                "Demo charges updated successfully."
            );

            loadApplications();

        } else {

            alert(
                result.message ||
                "Charges update failed."
            );

        }

    } catch (error) {

        console.log(error);

        alert(
            "Server se connection nahi ho raha hai."
        );

    }

}


/* ================================
   GET CHARGE VALUE
================================ */

function getChargeValue(
    name,
    index
) {

    const checkbox =
        document.getElementById(
            "select-" +
            name +
            "-" +
            index
        );

    const input =
        document.getElementById(
            name +
            "-" +
            index
        );

    if (
        !checkbox ||
        !checkbox.checked
    ) {
        return 0;
    }

    if (!input) {
        return 0;
    }

    return Number(
        input.value || 0
    );

}


/* ================================
   SEARCH
================================ */

document
    .getElementById("searchBox")
    .addEventListener(
        "input",
        function() {

            const search =
                this.value
                    .toLowerCase()
                    .trim();

            const filtered =
                allApplications.filter(
                    function(app) {

                        return (

                            (app.name || "")
                                .toLowerCase()
                                .includes(search)

                            ||

                            (app.mobile || "")
                                .includes(search)

                        );

                    }
                );

            displayApplications(
                filtered
            );

        }
    );
